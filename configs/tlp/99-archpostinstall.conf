# ArchPostInstall - TLP overrides focused on stability + low power.

# Keep Wi-Fi power saving disabled for reliable SSH/networking.
WIFI_PWR_ON_AC=off
WIFI_PWR_ON_BAT=off

# Never auto-disable network devices.
DEVICES_TO_DISABLE_ON_AC=""
DEVICES_TO_DISABLE_ON_BAT=""
DEVICES_TO_DISABLE_ON_BAT_NOT_IN_USE=""

# CPU policy: balanced by default, aggressive saving only in power-saver.
CPU_ENERGY_PERF_POLICY_ON_AC=balance_performance
CPU_ENERGY_PERF_POLICY_ON_BAT=balance_power
CPU_ENERGY_PERF_POLICY_ON_SAV=power

CPU_BOOST_ON_AC=1
CPU_BOOST_ON_BAT=1
CPU_BOOST_ON_SAV=0

# Vendor platform profile (if supported).
PLATFORM_PROFILE_ON_AC=balanced
PLATFORM_PROFILE_ON_BAT=balanced
PLATFORM_PROFILE_ON_SAV=low-power

# Runtime power management.
RUNTIME_PM_ON_AC=on
RUNTIME_PM_ON_BAT=auto
