# MPV 键位绑定配置
# 格式: 键位 命令

##################
# 播放控制快捷键 #
##################

# 空格: 播放/暂停
SPACE cycle pause

# 方向键: 快进/后退
LEFT seek -5
RIGHT seek 5
UP seek 60
DOWN seek -60

# Shift + 方向键: 精确调整
Shift+LEFT seek -1 exact
Shift+RIGHT seek 1 exact

# 鼠标滚轮: 音量调节
WHEEL_UP add volume 2
WHEEL_DOWN add volume -2

# Page键: 章节跳转
PGUP add chapter 1
PGDWN add chapter -1

# Home/End: 跳转到开头/结尾
HOME seek 0 absolute
END seek 100 absolute-percent

# , / .: 逐帧播放（暂停状态下）
, frame-back-step
. frame-step

###############
# 字幕控制 #
###############

# v: 显示/隐藏字幕
v cycle sub-visibility

# j / k（J 兼容）: 切换字幕轨道
j cycle sub
k cycle sub down
J cycle sub down

# z / Z: 字幕延迟调整
z add sub-delay -0.1
Z add sub-delay +0.1

# x / X: 字幕缩放
x add sub-scale -0.1
X add sub-scale +0.1

# r / R: 字幕位置上下调整
r add sub-pos -1
R add sub-pos +1

###############
# 音频控制 #
###############

# 0 / 9: 音量调节
0 add volume -2
9 add volume 2

# m: 静音
m cycle mute

# a: 切换音轨
a cycle audio

# Alt+0 / Alt+9: 音频延迟调整
Alt+0 add audio-delay -0.1
Alt+9 add audio-delay +0.1

###############
# 视频控制 #
###############

# 1 / 2: 对比度调整
1 add contrast -1
2 add contrast 1

# 3 / 4: 亮度调整
3 add brightness -1
4 add brightness 1

# 5 / 6: 伽马调整
5 add gamma -1
6 add gamma 1

# 7 / 8: 饱和度调整
7 add saturation -1
8 add saturation 1

# d: 去隔行扫描
d cycle deinterlace

# A: 循环画面比例
A cycle-values video-aspect-override "16:9" "4:3" "2.35:1" "-1"

# Ctrl+h: 水平翻转
Ctrl+h cycle video-flip

# Ctrl+v: 垂直翻转
Ctrl+v cycle video-mirror

###############
# 窗口控制 #
###############

# f: 全屏切换
f cycle fullscreen

# ESC: 退出全屏
ESC set fullscreen no

# T: 置顶开关
T cycle ontop

# b: 边框开关
b cycle border

# o / O: 显示进度条（临时）
o show-progress
O no-osd cycle-values osd-level 3 1

# i / I: 显示统计信息
i script-binding stats/display-stats
I script-binding stats/display-stats-toggle

###############
# 截图功能 #
###############

# s: 截图（不含字幕）
s screenshot video

# S: 截图（含字幕）
S screenshot

# Ctrl+s: 连续截图（每帧）
Ctrl+s screenshot window

###############
# 播放列表 #
###############

# < / >: 上一个/下一个文件
< playlist-prev
> playlist-next

# ENTER: 下一个文件
ENTER playlist-next

# Shift+ENTER: 上一个文件
Shift+ENTER playlist-prev

###############
# 播放速度 #
###############

# [ / ]: 播放速度调整
[ multiply speed 0.9091
] multiply speed 1.1

# Backspace: 重置播放速度
BS set speed 1.0

###############
# 其他功能 #
###############

# q: 退出
q quit

# Q: 保存位置并退出
Q quit-watch-later

# p: 显示播放列表
p show-text ${playlist}

# l: 开启/关闭循环
l cycle-values loop-file "inf" "no"

# L: 开启/关闭播放列表循环
L cycle-values loop-playlist "inf" "no"

# Ctrl+r: 重新加载文件
Ctrl+r seek 0 absolute; set pause no

# `（反引号）: 控制台
` script-binding console/enable

#####################
# 鼠标手势（可选） #
#####################

# 双击全屏
# MBTN_LEFT_DBL cycle fullscreen

# 右键显示菜单（需要脚本）
# MBTN_RIGHT script-binding uosc/menu

# 中键暂停
MBTN_MID cycle pause

# 侧键切换文件
MBTN_BACK playlist-prev
MBTN_FORWARD playlist-next

#####################
# 高级功能（推荐） #
#####################

# F1-F4: 切换视频质量配置
# F1 apply-profile low-quality
# F2 apply-profile medium-quality
# F3 apply-profile high-quality
# F4 apply-profile ultra-quality

# Ctrl+1: 50% 窗口大小
Ctrl+1 set window-scale 0.5

# Ctrl+2: 100% 窗口大小
Ctrl+2 set window-scale 1.0

# Ctrl+3: 150% 窗口大小
Ctrl+3 set window-scale 1.5

# Ctrl+4: 200% 窗口大小
Ctrl+4 set window-scale 2.0

# h: 硬件解码切换
h cycle-values hwdec "auto-safe" "no"

# c: 裁剪黑边（需要脚本）
# c script-binding auto-crop/toggle-crop

# e: 显示媒体信息
e show-text ${media-title}

# w: 显示当前路径
w show-text ${path}
