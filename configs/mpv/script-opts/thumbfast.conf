# thumbfast configuration
# Higher limits -> higher quality thumbnails, more CPU/GPU work.
max_height=360
max_width=640
tone_mapping=no

# Start thumbnailer immediately to avoid first-hover delay.
spawn_first=yes

# Allow thumbnails for network streams (e.g. youtube).
network=yes

# Quit thumbnailer after being idle for this many seconds (0 = never).
quit_after_inactivity=60
