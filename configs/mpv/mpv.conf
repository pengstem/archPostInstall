# Quality-first mpv config (GPU renderer)

# Video output
vo=gpu-next
profile=high-quality
gpu-api=auto

# Scaling (high-quality defaults with explicit filters)
scale=ewa_lanczossharp
cscale=ewa_lanczossharp
dscale=mitchell
sigmoid-upscaling=yes

# Debanding
# Lower values preserve more detail; raise for stronger debanding.
deband=yes
deband-iterations=2
deband-threshold=48
deband-range=16
deband-grain=24

# Dithering
# error-diffusion uses compute shaders; mpv will fall back if unsupported.
dither=error-diffusion
dither-depth=auto

# Color management / HDR tone mapping
icc-profile-auto=yes
tone-mapping=bt.2446a
hdr-compute-peak=auto

# uosc integration (recommended tweaks)
osd-bar=no
border=no
video-sync=display-resample

# Audio defaults
volume-max=130
volume=130

# Watch later (resume playback position on next open)
save-position-on-quit=yes
resume-playback=yes
