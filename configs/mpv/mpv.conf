###########
# General #
###########

# 优先使用GPU解码
hwdec=auto-safe
# GPU渲染API (根据系统选择: auto / vulkan / opengl / d3d11)
gpu-api=auto
# 高质量视频输出
vo=gpu-next
# 高质量缩放算法
scale=ewa_lanczossharp
cscale=ewa_lanczossharp
dscale=mitchell
# 时间插值，使视频更流畅(可选，性能要求高)
# video-sync=display-resample
# interpolation=yes
# tscale=oversample

# 保持播放器窗口始终在最前
# ontop=yes
# 无边框窗口
# border=no
# 记住窗口大小和位置
geometry=50%:50%
autofit-larger=85%x85%
autofit-smaller=30%x30%
# 保持播放器在屏幕上方中央
# keep-open=yes

##########
# 字幕 #
##########

# 字幕语言优先级
slang=chi,zh,zh-CN,zh-TW,zho,eng,en
# 自动加载外挂字幕
sub-auto=fuzzy
# 字体设置
sub-font='sans-serif'
sub-font-size=48
sub-bold=yes
sub-border-size=2.5
sub-color='#FFFFFF'
sub-border-color='#000000'
sub-shadow-offset=1
sub-shadow-color='#000000'
# 字幕位置（底部）
sub-pos=95
# 字幕编码（自动检测）
sub-codepage=auto

##########
# 音频 #
##########

# 音频语言优先级
alang=chi,zh,zh-CN,zho,jpn,ja,eng,en
# 音量范围扩展到150%
volume-max=150
# 默认音量
volume=100
# 音频归一化（平衡不同视频音量）
af=loudnorm=I=-16:TP=-3:LRA=4
# 音频输出通道
audio-channels=auto

################
# 播放控制 #
################

# 播放结束后保持窗口打开
keep-open=yes
# 恢复上次播放位置
save-position-on-quit=yes
# 循环播放
# loop-file=inf
# 播放列表循环
# loop-playlist=inf
# 自动加载播放列表中的下一个文件
# 快进/后退步长
seek-step=5

###############
# 截图设置 #
###############

# 截图保存路径（保存到视频所在目录）
screenshot-directory=~/Pictures/mpv-screenshots
# 截图格式（png质量最高，webp体积小）
screenshot-format=png
# 截图质量（0-100，png无损）
screenshot-png-compression=7
# 截图包含字幕
screenshot-sw=no
# 截图文件名模板
screenshot-template="%F-%wH.%wM.%wS"

##################
# 性能优化设置 #
##################

# 解码线程数（auto自动）
vd-lavc-threads=0
# 缓存设置（MB）
cache=yes
demuxer-max-bytes=400M
demuxer-max-back-bytes=150M
# 网络流缓存
stream-buffer-size=4M

################
# OSD界面设置 #
################

# OSD信息显示时长（毫秒）
osd-duration=2500
# OSD字体大小
osd-font-size=40
# OSD边框
osd-border-size=1.5
# OSD位置
osd-bar-align-y=0.9
# 显示文件名
osd-playing-msg='${filename}'

##################
# 高级功能推荐 #
##################

# 去色带（减少视频压缩导致的色带）
deband=yes
deband-iterations=2
deband-threshold=35
deband-range=16
deband-grain=5

# 色彩管理
# icc-profile-auto=yes
# target-prim=auto
# target-trc=auto

# HDR色调映射（HDR转SDR）
tone-mapping=hable
hdr-compute-peak=yes

# 统计信息（按i键显示）
# term-osd-bar=yes

# YouTube质量优先
# ytdl-format=bestvideo[height<=?1080]+bestaudio/best

# 自动加载同目录文件到播放列表
# directory-mode=auto

################
# 实验性功能 #
################

# 游戏模式：低延迟播放（适合实时视频）
# profile=low-latency
# video-latency-hacks=yes
# audio-buffer=0.05

# 动漫优化配置（锐化增强）
# profile=anime
# [anime]
# deband=yes
# scale=ewa_lanczossharp
# cscale=ewa_lanczossharp
# glsl-shaders="~~/shaders/Anime4K_Clamp_Highlights.glsl:~~/shaders/Anime4K_Restore_CNN_M.glsl:~~/shaders/Anime4K_Upscale_CNN_x2_M.glsl:~~/shaders/Anime4K_AutoDownscalePre_x2.glsl:~~/shaders/Anime4K_AutoDownscalePre_x4.glsl:~~/shaders/Anime4K_Upscale_CNN_x2_S.glsl"
