# ==========================================
#  General Settings
# ==========================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'

# Prefix: Alt + s
set -g prefix M-s
unbind C-b
bind M-s send-prefix

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display '~/.config/tmux/tmux.conf sourced'

# Basic Behavior
setw -g xterm-keys on
set -s escape-time 0
set -sg repeat-time 300
set -s focus-events on
set -g mouse on
set -sg exit-empty on
set -g detach-on-destroy off

# Activity / Bells
set -g visual-activity off
setw -g monitor-activity off
setw -g monitor-bell off
set -g history-limit 10000

# Character Encoding
set -q -g status-utf8 on
setw -q -g utf8 on

# Display Settings
set -g base-index 1
setw -g pane-base-index 1
setw -g automatic-rename on
set -g renumber-windows on
set -g set-titles on
set -g display-panes-time 2000
set -g display-time 2000

# ==========================================
#  Theme & UI
# ==========================================

# Colors
set -g default-terminal "tmux-256color"
set -as terminal-features ",*256col*:RGB"
set -as terminal-overrides ",*256col*:Tc"

# Cursor
set -ga terminal-features ',xterm-kitty*:cstyle'
set -as terminal-overrides ',*:Ss=\E[%p1%d q:Se=\E[ q'

# Pane Borders
set -g pane-active-border-style fg=#b294bb
set -g pane-border-style fg=colour237

# Status Bar
set -g status-position top
set -g status-justify left
set -g status-left-length 200
set -g status-right-length 140
setw -g window-status-separator ''

# Status Colors
set -g status-bg "#1d1f21"
set -g status-fg "#c5c8c6"

# Status Left: Session List (Custom Script)
# Handles clicking to switch sessions
bind -n MouseDown1StatusLeft run-shell '~/.config/tmux/scripts/click_session.sh "#{mouse_x}"'
set -g status-left '#( ~/.config/tmux/scripts/session_list.sh )'

# Status Right: Prefix | Zoom | Time | Date
set -g status-right '#[fg=red,bold]#{?client_prefix,PREFIX ,}#[fg=#b294bb,bold]#{?window_zoomed_flag,ZOOM ,}#[fg=#8abeb7]%H:%M #[fg=colour237]│ #[fg=#f0c674]%Y-%m-%d '

# Window Status
setw -g window-status-format '#[fg=#c5c8c6,bg=#1d1f21] #I #W '
setw -g window-status-current-format '#[fg=#1d1f21,bg=#b294bb,bold] #I #W '

# ==========================================
#  Session Management
# ==========================================

# Create New Session (Sequential Naming)
bind M-c run-shell '~/.config/tmux/scripts/new_session.sh'

# Switch to Nth Created Session (Prefix + 1-9)
bind 1 run-shell '~/.config/tmux/scripts/switch_nth_session.sh 1'
bind 2 run-shell '~/.config/tmux/scripts/switch_nth_session.sh 2'
bind 3 run-shell '~/.config/tmux/scripts/switch_nth_session.sh 3'
bind 4 run-shell '~/.config/tmux/scripts/switch_nth_session.sh 4'
bind 5 run-shell '~/.config/tmux/scripts/switch_nth_session.sh 5'
bind 6 run-shell '~/.config/tmux/scripts/switch_nth_session.sh 6'
bind 7 run-shell '~/.config/tmux/scripts/switch_nth_session.sh 7'
bind 8 run-shell '~/.config/tmux/scripts/switch_nth_session.sh 8'
bind 9 run-shell '~/.config/tmux/scripts/switch_nth_session.sh 9'

# Rename Session 0 on startup/load (if exists)
set-hook -g session-created 'run-shell "~/.config/tmux/scripts/rename_session_zero.sh"'
run-shell '~/.config/tmux/scripts/rename_session_zero.sh'

# Session Helper Keys
bind -n M-w "choose-tree -swZ"      # Alt+w: Tree View
bind -n M-r command-prompt -I "#S" "rename-session '%%'" # Alt+r: Rename

# ==========================================
#  Window Management
# ==========================================

# Create/Kill
bind -n M-o new-window -c "#{pane_current_path}"
bind -n M-Q kill-pane
unbind c

# Navigation (Prev/Next)
unbind n
unbind p
bind -r C-p previous-window
bind -r C-n next-window

# Switch to Window by Index (Alt + 1-9)
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Split Window
# Vim-like
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind _ split-window -v -c "#{pane_current_path}"
# Standard
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# ==========================================
#  Pane Management
# ==========================================

# Navigation (Vim: Alt + h/j/k/l)
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Swap Panes
bind > swap-pane -D
bind < swap-pane -U

# Resize (Vim: Alt + H/J/K/L)
bind -n M-f resize-pane -Z
bind -n M-H resize-pane -L 3
bind -n M-J resize-pane -D 3
bind -n M-K resize-pane -U 3
bind -n M-L resize-pane -R 3

# ==========================================
#  Copy Mode (Vim Style)
# ==========================================
set -g status-keys emacs
set -g mode-keys vi

bind -n M-v copy-mode
bind b list-buffers
bind p paste-buffer

# Navigation in Copy Mode
bind -T copy-mode-vi h send-keys -X cursor-left
bind -T copy-mode-vi j send-keys -X cursor-down
bind -T copy-mode-vi k send-keys -X cursor-up
bind -T copy-mode-vi l send-keys -X cursor-right

# Popup Terminal
bind -n M-g display-popup -E -d "#{pane_current_path}" -w 80% -h 80%

# ==========================================
#  Plugins
# ==========================================
run '~/.config/tmux/plugins/tpm/tpm'