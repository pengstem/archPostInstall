# DPMS toggle configuration
# Lock/unlock automation is handled by archpostinstall-dpms-lock-monitor.service.
# This file is sourced by dpms-toggle.sh and uses the helper DSL from dpms-common.sh.

dpms_defaults \
    --verbose 2 \
    --log-file "$HOME/.cache/archpostinstall/dpms.log" \
    --log-max-bytes 1048576 \
    --log-keep 3 \
    --start-wait 15 \
    --start-retries 3 \
    --kill-wait 6

# Apps that should be stopped on display-off and started on display-on.
dpms_app \
    --name zen-browser \
    --match 'zen-bin|zen-browser' \
    --start 'zen-browser'

dpms_app \
    --name wechat \
    --match 'WeChat.AppImage|/tmp/.mount_WeChat|WeChatAppEx|/usr/bin/wechat' \
    --start '/home/nastem/Applications/WeChat.AppImage'

dpms_app \
    --name qq \
    --match 'QQ.AppImage|/tmp/.mount_QQ|/usr/bin/qq|/qq' \
    --start '/home/nastem/Applications/QQ.AppImage'

# Start-only apps are left running when the display turns off.
dpms_app \
    --name kitty \
    --match 'kitty' \
    --start 'kitty' \
    --action start

# Stop-only apps are not reopened by DPMS.
dpms_app --name steam --match 'steam' --action stop
dpms_app --name firefox --match 'firefox' --action stop
