# DPMS toggle configuration
# Adjust these lists to control what is closed/restored when the display turns off/on.

# Apps to close on display-off and reopen on display-on (parallel arrays).
DPMS_REOPEN_NAMES=("firefox" "wechat" "qq")
DPMS_KILL_MATCHES=("firefox" "WeChat.AppImage|/tmp/.mount_WeChat|WeChatAppEx|/usr/bin/wechat" "QQ.AppImage|/tmp/.mount_QQ|/usr/bin/qq|/qq")
DPMS_WM_CLASSES=("firefox" "wechat" "qq")
DPMS_REOPEN_COMMANDS=("firefox" "/home/nastem/Applications/WeChat.AppImage" "/home/nastem/Applications/QQ.AppImage")

# Apps to kill on display-off but never reopen.
DPMS_KILL_ONLY_MATCHES=("steam")
DPMS_KILL_ONLY_WM_CLASSES=("steam")

# Apps that should remain running (informational; not killed by default).
# Keep list for GUI apps that should never be killed (matches WM class or process name).
DPMS_KEEP_PROCS=("kitty" "sparkle" "gnome-shell" "org.gnome.Shell")

# Power profiles (requires power-profiles-daemon).
DPMS_POWER_PROFILE_ON="balanced"
DPMS_POWER_PROFILE_OFF="power-saver"
DPMS_POWER_PROFILE_OFF_SSH="performance"

# TLP profiles (requires tlp; use sudo -n for non-interactive timers).
DPMS_TLP_PROFILE_ON="balanced"
DPMS_TLP_PROFILE_OFF="power-saver"
DPMS_TLP_PROFILE_OFF_SSH="performance"
DPMS_TLP_USE_SUDO=1

# Logging and verbosity.
DPMS_VERBOSE=2
DPMS_LOG_FILE="$HOME/.cache/archpostinstall/dpms.log"
# Rotate log if it grows beyond this size in bytes (0 disables).
DPMS_LOG_MAX_BYTES=1048576
# Log cleanup: remove rotated logs older than this many days (0 disables).
DPMS_LOG_CLEANUP_DAYS=14
# Log cleanup: keep at most this many rotated logs (0 disables).
DPMS_LOG_CLEANUP_MAX_FILES=10

# Idle timeout for automatic display-off (minutes).
DPMS_IDLE_MINUTES=15
# Skip idle DPMS while media players report "Playing" (requires playerctl).
DPMS_SKIP_WHEN_PLAYING=1

# Delay before reopening apps (seconds).
DPMS_REOPEN_DELAY_SEC=2
DPMS_START_WAIT_SEC=15
DPMS_START_RETRIES=3

# Wait this many seconds for apps to exit before SIGKILL.
DPMS_KILL_WAIT_SEC=6

# Set to 1 to attempt killing other GUI apps (best-effort).
DPMS_KILL_OTHER_GUI=1

# Optional: suspend after display-off when no SSH session is active.
DPMS_SUSPEND_IF_NO_SSH=0
DPMS_SUSPEND_DELAY_SEC=30
