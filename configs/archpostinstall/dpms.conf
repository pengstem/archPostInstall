# DPMS toggle configuration
# Adjust these lists to control what is closed/restored when the display turns off/on.

# Apps to close on display-off and reopen on display-on (parallel arrays).
DPMS_REOPEN_NAMES=("firefox" "wechat" "qq")
DPMS_KILL_MATCHES=("firefox" "/home/nastem/Applications/WeChat.AppImage" "/home/nastem/Applications/QQ.AppImage")
DPMS_REOPEN_COMMANDS=("firefox" "gtk-launch WeChat" "gtk-launch QQ")

# Apps that should remain running (informational; not killed by default).
# Keep list for GUI apps that should never be killed (matches WM class or process name).
DPMS_KEEP_PROCS=("kitty" "sparkle" "gnome-shell" "org.gnome.Shell")

# Power profiles (requires power-profiles-daemon).
DPMS_POWER_PROFILE_ON="balanced"
DPMS_POWER_PROFILE_OFF="power-saver"
DPMS_POWER_PROFILE_OFF_SSH="power-saver"

# Logging and verbosity.
DPMS_VERBOSE=1
DPMS_LOG_FILE="$HOME/.cache/archpostinstall/dpms.log"

# Idle timeout for automatic display-off (minutes).
DPMS_IDLE_MINUTES=15

# Delay before reopening apps (seconds).
DPMS_REOPEN_DELAY_SEC=2

# Wait this many seconds for apps to exit before SIGKILL.
DPMS_KILL_WAIT_SEC=6

# Set to 1 to attempt killing other GUI apps (best-effort).
DPMS_KILL_OTHER_GUI=1

# Optional: suspend after display-off when no SSH session is active.
DPMS_SUSPEND_IF_NO_SSH=0
DPMS_SUSPEND_DELAY_SEC=60
