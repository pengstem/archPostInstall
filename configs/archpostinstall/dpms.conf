# DPMS toggle configuration
# Lock/unlock automation is handled by archpostinstall-dpms-lock-monitor.service.
# This file is sourced by dpms-toggle.sh and uses the helper DSL from dpms-common.sh.

dpms_defaults \
    --power-backend auto \
    --profile-on balanced \
    --profile-off power-saver \
    --profile-off-ssh balanced \
    --switch-power 1 \
    --tlp-use-sudo 1 \
    --verbose 2 \
    --log-file "$HOME/.cache/archpostinstall/dpms.log" \
    --log-max-bytes 1048576 \
    --log-keep 3 \
    --reopen-delay 2 \
    --start-wait 15 \
    --start-retries 3 \
    --kill-wait 6

# Apps that should be closed when the display turns off and ensured running on unlock.
dpms_app \
    --name zen-browser \
    --match 'zen-bin|zen-browser' \
    --start 'zen-browser' \
    --stop 'pkill -TERM zen-bin' \
    --policy always

dpms_app \
    --name wechat \
    --match 'WeChat.AppImage|/tmp/.mount_WeChat|WeChatAppEx|/usr/bin/wechat' \
    --start '/home/nastem/Applications/WeChat.AppImage' \
    --policy always

dpms_app \
    --name qq \
    --match 'QQ.AppImage|/tmp/.mount_QQ|/usr/bin/qq|/qq' \
    --start '/home/nastem/Applications/QQ.AppImage' \
    --policy always

# Apps that should be opened on unlock if missing, but not touched on lock.
dpms_app \
    --name kitty \
    --match 'kitty' \
    --start 'kitty' \
    --policy on_only

# Apps that should be closed on lock and never reopened by DPMS.
dpms_kill_only --name steam --match 'steam'
dpms_kill_only --name firefox --match 'firefox'
