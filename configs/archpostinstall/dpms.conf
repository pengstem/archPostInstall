# DPMS toggle configuration
# This file is sourced by dpms-toggle.sh, which defines dpms_app.

# Apps that should be stopped on display-off and started on display-on.
dpms_app \
    --name zen-browser \
    --match 'zen-bin|zen-browser' \
    --start 'zen-browser'

# Started via their desktop entries so env (e.g. WeChat's IM module vars) lives
# in one place instead of being duplicated here.
dpms_app \
    --name wechat \
    --match 'WeChat.AppImage|/tmp/.mount_WeChat|WeChatAppEx|/usr/bin/wechat' \
    --start 'gtk-launch WeChat'

# QQ ignores SIGTERM, so waiting for it only delays the KILL.
dpms_app \
    --name qq \
    --match 'QQ.AppImage|/tmp/.mount_QQ|/usr/bin/qq|/qq' \
    --start 'gtk-launch QQ' \
    --signal KILL

# Start-only apps are left running when the display turns off.
dpms_app \
    --name kitty \
    --match 'kitty' \
    --start 'kitty' \
    --action start

# Stop-only apps are not reopened by DPMS.
dpms_app --name steam --match 'steam' --action stop
dpms_app --name firefox --match 'firefox' --action stop
