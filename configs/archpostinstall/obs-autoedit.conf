# OBS auto-edit configuration
# Post-process OBS recordings and remove segments where:
#   1) Audio is silent for long enough, AND
#   2) Video is almost still for long enough.
#
# Toggle the feature (recommended):
#   systemctl --user enable --now archpostinstall-obs-autoedit.path
#   systemctl --user disable --now archpostinstall-obs-autoedit.path
#
# Manual run:
#   archpostinstall obs-autoedit /path/to/video.mkv

OBS_AUTOEDIT_ENABLED=1

# Input/output locations.
OBS_AUTOEDIT_WATCH_DIR="$HOME/Videos/obs"
OBS_AUTOEDIT_OUTPUT_DIR="$HOME/Videos/obs/edited"
OBS_AUTOEDIT_OUTPUT_SUFFIX="-autoedit"

# Safety: consider a recording "done" when file size is stable for this many seconds.
OBS_AUTOEDIT_STABLE_SECONDS=3

# Detection thresholds.
OBS_AUTOEDIT_SILENCE_DB="-45dB"
OBS_AUTOEDIT_SILENCE_DURATION_SEC=1.5
OBS_AUTOEDIT_FREEZE_NOISE=0.002
OBS_AUTOEDIT_FREEZE_DURATION_SEC=1.5

# Editing behavior.
OBS_AUTOEDIT_PAD_SEC=0.15
OBS_AUTOEDIT_MIN_KEEP_SEC=0.25

# Analysis speed-ups (lower = faster, less accurate).
OBS_AUTOEDIT_ANALYZE_FPS=10
OBS_AUTOEDIT_ANALYZE_WIDTH=640

# Encoding defaults (ffmpeg).
OBS_AUTOEDIT_VIDEO_CODEC="av1_nvenc"
OBS_AUTOEDIT_NVENC_PRESET="p6"
OBS_AUTOEDIT_NVENC_TUNE="hq"
OBS_AUTOEDIT_NVENC_RC="constqp"
OBS_AUTOEDIT_NVENC_QP=23
OBS_AUTOEDIT_NVENC_MULTIPASS="qres"
OBS_AUTOEDIT_NVENC_LOOKAHEAD=16
OBS_AUTOEDIT_NVENC_TEMPORAL_AQ=1
OBS_AUTOEDIT_KEYINT_SEC=2

OBS_AUTOEDIT_AUDIO_CODEC="libopus"
OBS_AUTOEDIT_AUDIO_BITRATE="128k"
