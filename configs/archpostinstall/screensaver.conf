# Omarchy-inspired GNOME screensaver configuration.
# This file is sourced by scripts/gnome/screensaver.sh.

# Start after five minutes without keyboard or pointer activity.
SCREENSAVER_IDLE_SECONDS=300

# 22 pt keeps the centered wordmark readable on the 2560x1600 built-in display.
SCREENSAVER_FONT_FAMILY="Maple Mono NF CN"
SCREENSAVER_FONT_SIZE=22
SCREENSAVER_FRAME_RATE=60

# Ignore the shortcut's key release and window-mapping activity before arming
# the global keyboard/pointer dismissal watch.
SCREENSAVER_INPUT_GRACE_SECONDS=2

# GNOME custom shortcut installed by `archpostinstall screensaver install`.
SCREENSAVER_SHORTCUT="<Super>F11"

# A curated subset of ttfx's most cinematic effects.
SCREENSAVER_EFFECTS=(
    beams
    binarypath
    burn
    decrypt
    fireworks
    laseretch
    matrix
    rain
    rings
    spotlights
    synthgrid
    thunderstorm
    vhstape
    waves
)
