font_family Maple Mono NF CN
font_size 14.0
background_opacity 0.8
hide_window_decorations yes

# Rounded split borders: the radius only applies to full borders, and is drawn
# over the corner cells, so pad the text away from it
draw_minimal_borders no
window_border_radius 6pt
window_padding_width 3

# Scrollbar while scrolled back or when hovering the right edge
scrollbar scrolled-or-hovered

# Drag selected text/links to other windows or apps (tab/window dragging uses the
# default drag_threshold)
mouse_map left press ungrabbed mouse_selection drag_or_normal_select

# Clicks (e.g. click-to-move the prompt cursor) wait this long to rule out a
# double click; the GNOME default of 0.4s makes them feel laggy
click_interval 0.15

# Cursor trail - animated trail following cursor jumps
cursor_trail 3
cursor_trail_decay 0.05 0.3
cursor_trail_start_threshold 2

# Cursor polish
cursor_blink_interval 0.75
cursor_stop_blinking_after 8.0
cursor_trail_color #f4efe7

# GPU effects (click ripple, lightning trail); see shaders/effects.pipeline.
# Needs slangc (shader-slang)
custom_shaders effects

# Signature watermark
window_logo_path nastem-signature.png
window_logo_position top-right
window_logo_alpha 0.14
window_logo_scale 10

map ctrl+shift+up   scroll_line_up smooth
map ctrl+shift+down scroll_line_down smooth

# --- 标签页管理 (Tabs) ---
map alt+o       launch --cwd=current --type=tab --location=neighbor
map alt+w       close_tab
map ctrl+shift+m combine : detach_window tab-prev : goto_layout horizontal
# map alt+right   next_tab
# map alt+left    previous_tab
map alt+1       goto_tab 1
map alt+2       goto_tab 2
map alt+3       goto_tab 3
map alt+4       goto_tab 4
map alt+5       goto_tab 5
map alt+6       goto_tab 6
map alt+7       goto_tab 7
map alt+8       goto_tab 8
map alt+9       goto_tab 9
map ctrl+tab    goto_tab -1

# --- 分屏管理 (Windows/Splits) ---
# 垂直分屏（左右）
map alt+v       launch --cwd=current --location=vsplit
# 水平分屏（上下）
map alt+s       launch --cwd=current --location=hsplit
# 关闭当前分屏
map alt+x       close_window

# --- 智能分屏 / 标签页导航 ---
# Alt+h:
#   左边有 pane -> 切到左侧 pane
#   左边无 pane -> previous_tab
#
# Alt+l:
#   右边有 pane -> 切到右侧 pane
#   右边无 pane -> next_tab
#
# smart-nav 路径相对于 kitty 配置目录 (~/.config/kitty/)
map alt+h       remote_control_script smart-nav left
map alt+l       remote_control_script smart-nav right
map alt+k       neighboring_window up
map alt+j       neighboring_window down

# --- 调整分屏大小 ---
map alt+shift+h resize_window narrower 3
map alt+shift+l resize_window wider 3
map alt+shift+k resize_window taller 3
map alt+shift+j resize_window shorter 3

# 允许启用的布局（排在第一个的是默认布局）
enabled_layouts splits,stack,tall,fat,grid

# 一键最大化/恢复当前分屏（优雅替代 Tmux 的 Zoom 功能）
map alt+z toggle_layout stack

tab_bar_style        powerline
tab_powerline_style round
tab_bar_edge top
tab_title_template "{fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{tab.last_focused_progress_percent}{(tab.active_wd or title).rstrip('/').rsplit('/', 1)[-1] or '/'}"

# kitty-scrollback.nvim
allow_remote_control socket-only
listen_on unix:${XDG_RUNTIME_DIR}/kitty
shell_integration enabled
map ctrl+shift+y copy_last_command_output
action_alias kitty_scrollback_nvim kitten ~/.local/share/nvim/lazy/kitty-scrollback.nvim/python/kitty_scrollback_nvim.py --nvim-args -n
map kitty_mod+h kitty_scrollback_nvim
map kitty_mod+g kitty_scrollback_nvim --config ksb_builtin_last_cmd_output
mouse_map ctrl+shift+right press ungrabbed combine : mouse_select_command_output : kitty_scrollback_nvim --config ksb_builtin_last_visited_cmd_output
