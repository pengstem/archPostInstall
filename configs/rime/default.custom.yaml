# Personal settings preserved during the 2026-09-12 submodule migration.
# Edit this patch, not the linked upstream YAML.
patch:
  config_version: '2024-07-12'
  schema_list:
  - schema: rime_frost
  - schema: rime_frost_double_pinyin
  - schema: rime_frost_double_pinyin_mspy
  - schema: rime_frost_double_pinyin_sogou
  - schema: rime_frost_double_pinyin_flypy
  switcher/hotkeys:
  - F4
  - Control+grave
  - Control+Shift+grave
  switcher/save_options:
  - ascii_punct
  - traditionalization
  - emoji
  - full_shape
  menu/page_size: 8
  # 追加到上游 key_binder 之后。候选框是竖排的，Up/Down 就是上/下一个候选。
  # 光标在拼音间移动改用 Alt+←/→ 或 Tab / Shift+Tab（上游已有）。
  key_binder/bindings/+:
  - { when: has_menu, accept: Left, send: Up }
  - { when: has_menu, accept: Right, send: Down }
  # 逗号只在已经翻过页时才往回翻，第一页按逗号照常上屏「，」
  - { when: paging, accept: comma, send: Page_Up }
  - { when: has_menu, accept: period, send: Page_Down }
