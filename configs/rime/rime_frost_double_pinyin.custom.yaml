# Personal settings preserved during the 2026-09-12 submodule migration.
# Edit this patch, not the linked upstream YAML.
patch:
  schema/name: 自然码双拼
  schema/author:
  - Dvel
  schema/description: '雾凇拼音 - 自然码双拼

    https://github.com/iDvel/rime-ice

    '
  schema/dependencies:
  - melt_eng
  - radical_pinyin
  - rime_frost_aux
  switches:
  - name: ascii_mode
    states:
    - 中
    - Ａ
  - name: ascii_punct
    states:
    - ¥
    - $
  - name: traditionalization
    states:
    - 简
    - 繁
  - name: emoji
    states:
    - 💀
    - 😄
    reset: 1
  - name: full_shape
    states:
    - 半角
    - 全角
  engine/translators:
  - punct_translator
  - table_translator@frost_aux
  - script_translator
  - lua_translator@*date_translator
  - lua_translator@*lunar
  - table_translator@custom_phrase
  - table_translator@melt_eng
  - table_translator@cn_en
  - table_translator@radical_lookup
  - lua_translator@*unicode
  - lua_translator@*number_translator
  - lua_translator@*force_gc
  - lua_translator@*calculator
  engine/filters:
  - lua_filter@*is_in_user_dict
  - lua_filter@*corrector
  - reverse_lookup_filter@radical_reverse_lookup
  - lua_filter@*autocap_filter
  - lua_filter@*reduce_english_filter
  - lua_filter@*aux_lookup_filter
  - simplifier@emoji
  - simplifier@traditionalize
  - uniquifier
  pin_cand_filter: null
  translator/max_homographs: null
  translator/max_homophones: null
  translator/max_sentences: null
  translator/grammar_penalty: null
  custom_phrase/user_dict: custom_phrase_double
  key_binder/bindings: null
  chaifen_all: null
  chaifen: null
  chinese_english: null
  grammar: null
  mars: null
